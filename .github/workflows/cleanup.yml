name: Branch Cleanup

on:
  schedule:
    - cron: "0 2 1 * *" # Primer día de cada mes a las 2:00 AM UTC
  workflow_dispatch: # Permite ejecución manual

jobs:
  cleanup-old-branches:
    name: Cleanup merged branches older than 30 days
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Git sweep old merged and stale branches
        uses: rod-dot-codes/git-sweep-merged-and-stale@latest
        with:
          action: cleanup
          which_master_main: develop
          delete_stale_after_days: 45
