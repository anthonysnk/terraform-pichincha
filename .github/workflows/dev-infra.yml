name: Terraform dev infrastructure

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "terraform/infrastructure/**"
      - ".github/workflows/dev-infra.yml"

permissions:
  contents: read

env:
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.17.1' }}

jobs:
  format:
    name: Check Terraform formatting
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infrastructure
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

  plan:
    name: Plan infrastructure in HCP Terraform
    if: ${{ github.event.action != 'closed' }}
    needs: format
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: terraform/infrastructure
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize remote backend
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo 'Set the TF_API_TOKEN repository secret with HCP Terraform access.' >&2
            exit 1
          fi
          backend_file="environments/${GITHUB_BASE_REF}.tfbackend"
          if [ ! -f "$backend_file" ]; then
            echo "Backend configuration not found: $backend_file" >&2
            exit 1
          fi
          terraform init -input=false -backend-config="$backend_file"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run speculative plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform plan -input=false -no-color

  apply:
    name: Apply merged infrastructure in HCP Terraform
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
    needs: format
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: terraform-apply-${{ github.base_ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/infrastructure
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out merged code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize remote backend
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo 'Set the TF_API_TOKEN repository secret with HCP Terraform access.' >&2
            exit 1
          fi
          backend_file="environments/${GITHUB_BASE_REF}.tfbackend"
          if [ ! -f "$backend_file" ]; then
            echo "Backend configuration not found: $backend_file" >&2
            exit 1
          fi
          terraform init -input=false -backend-config="$backend_file"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Apply merged configuration
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform apply -auto-approve -input=false -no-color
