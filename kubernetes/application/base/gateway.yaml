apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devsu-nodejs
  namespace: devsu-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
