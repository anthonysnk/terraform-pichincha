apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devsu-nodejs
  namespace: devsu-app
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: devsu-nodejs-public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    # Future HTTPS listener after the ACM certificate and application hostname exist.
    # The AWS Load Balancer Controller can discover the ACM certificate from the
    # hostname or use the certificate ARN annotation below.
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   hostname: app.example.com
    #   allowedRoutes:
    #     namespaces:
    #       from: Same


# Future ACM certificate association:
# metadata:
#   annotations:
#     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>

---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: devsu-nodejs-ip-targets
  namespace: devsu-app
spec:
  targetReference:
    kind: Service
    name: devsu-nodejs
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /health

---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: devsu-nodejs-public
  namespace: devsu-app
spec:
  scheme: internet-facing
