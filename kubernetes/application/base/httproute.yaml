apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devsu-nodejs
  namespace: devsu-app
spec:
  parentRefs:
    - name: devsu-nodejs
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devsu-nodejs
          port: 8000

# CURRENT STATE:
# This HTTPRoute listens on the Gateway's HTTP listener and sends traffic
# directly to the application Service.
#
# FUTURE TLS STATE:
