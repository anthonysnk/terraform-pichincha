apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsu-nodejs
  namespace: devsu-app
  labels:
    app.kubernetes.io/name: devsu-nodejs
    app.kubernetes.io/part-of: devsu-nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devsu-nodejs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsu-nodejs
        app.kubernetes.io/part-of: devsu-nodejs
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devsu-nodejs-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsu-nodejs-database
                  key: DATABASE_PASSWORD
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
