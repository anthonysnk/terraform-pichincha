apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devsu-nodejs-database
  namespace: devsu-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: devsu-nodejs-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: /dev-pichincha/dev/application/database-password
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /dev-pichincha/dev/application/database-password
